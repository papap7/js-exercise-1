<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JS Exercise Display</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }
    .advertisement {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }
    .advertisement img {
      width: 150px;
      height: auto;
      border-radius: 10px;
    }
    .profile {
      margin: 20px 0;
    }
    .profile img {
      width: 200px;
      height: auto;
      border-radius: 50%;
      border: 3px solid #333;
    }
  </style>
</head>
<body>
  <h1>JavaScript Exercises Output</h1>

  <div class="profile">
    <h2>My Photo</h2>
    <img src="myphoto.jpg" alt="My Photo" />
  </div>

  <div class="advertisement">
    <img src="coke1.jpg" alt="Coke Ad 1" />
    <img src="coke2.jpg" alt="Coke Ad 2" />
    <img src="coke3.jpg" alt="Coke Ad 3" />
    <img src="coke4.jpg" alt="Coke Ad 4" />
    <img src="coke5.jpg" alt="Coke Ad 5" />
  </div>

  <script src="1exercise.js"></script>
  <script src="2exercise.js"></script>
  <script src="3exercise.js"></script>
  <script src="4exercise.js"></script>
</body>
</html>
